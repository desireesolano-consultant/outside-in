  <main>

                <rect x="3" y="5" width="18" height="14" rx="2"></rect>

                <line x1="12" y1="12.8" x2="12" y2="16"></line>

            <p data-i18n="heroParrafo1"></p>
            <p data-i18n="heroParrafo2"></p>
          </div>
          <div class="oi-hero-ctas">
            <a href="#entender" class="oi-boton oi-boton-primario" data-i18n="heroCtaPrimario"></a>
            <a href="#asi-automatice" class="oi-boton oi-boton-secundario" data-i18n="heroCtaSecundario"></a>

            <text class="oi-svg-etiqueta" data-lado="derecha" x="239" y="70" text-anchor="start" style="text-anchor: start" data-i18n="diagramaReportes"></text>

    <!-- 01 SOBRE -->
    <section id="sobre" class="oi-sobre">
      <div class="oi-sobre-inner">
        <div class="oi-etiqueta-seccion oi-etiqueta-clara oi-reveal" data-i18n="sobreEtiqueta"></div>
        <div class="oi-sobre-fotos oi-reveal">
          <img class="oi-sobre-foto-principal" src="img/desiree-sobre.jpg" alt="Desiree Solano" width="360" height="360" loading="lazy" />
          <img class="oi-sobre-foto-secundaria" src="img/desiree-sobre-2.jpg" alt="" width="180" height="180" loading="lazy" />
          <p class="oi-sobre-foto-pie" data-i18n="sobreFotoPie"></p>
        </div>
        <div class="oi-sobre-contenido">
          <blockquote class="oi-sobre-cita oi-reveal" data-i18n="sobreCita"></blockquote>
          <p class="oi-sobre-parrafo oi-reveal" id="sobre-parrafo"></p>
          <button type="button" id="boton-sobre" class="oi-boton oi-boton-claro" data-i18n="sobreBoton"></button>
        </div>
        <div class="oi-sobre-guia">
          <h3 class="oi-sobre-guia-titulo oi-reveal" data-i18n="guiaTitulo"></h3>
          <div class="oi-sobre-guia-grid">
            <a href="#entender" class="oi-sobre-guia-item oi-reveal">
              <span class="oi-sobre-guia-num">01</span>
              <span class="oi-sobre-guia-nombre" data-i18n="heroPalabra1"></span>
              <span class="oi-sobre-guia-texto" data-i18n="guiaEntender"></span>
            </a>
            <a href="#aterrizar" class="oi-sobre-guia-item oi-reveal">
              <span class="oi-sobre-guia-num">02</span>
              <span class="oi-sobre-guia-nombre" data-i18n="heroPalabra2"></span>
              <span class="oi-sobre-guia-texto" data-i18n="guiaConectar"></span>
            </a>
            <a href="#descubrir" class="oi-sobre-guia-item oi-reveal">
              <span class="oi-sobre-guia-num">03</span>
              <span class="oi-sobre-guia-nombre" data-i18n="heroPalabra3"></span>
              <span class="oi-sobre-guia-texto" data-i18n="guiaAnticipar"></span>
            </a>
          </div>
          <p class="oi-sobre-guia-nota oi-reveal" data-i18n="guiaMirada"></p>
        </div>
      </div>
    </section>

    <!-- 01 ENTENDER: lecturas individuales, scroll horizontal anclado -->
    <section id="entender" class="oi-entender oi-scrollx-section">
      <div class="oi-entender-cabecera">
        <div class="oi-etiqueta-seccion oi-etiqueta-clara oi-reveal" data-i18n="entenderEtiqueta"></div>
        <h2 class="oi-titulo-seccion oi-titulo-claro oi-reveal" data-i18n="entenderTitulo"></h2>
        <p class="oi-bajada-clara oi-reveal" data-i18n="entenderBajada"></p>
      </div>
      <div class="oi-scrollx-sticky">
        <div id="grid-entender" class="oi-scrollx-track"></div>
      </div>
    </section>

    <!-- 02 ATERRIZAR: frase interactiva con desplegables -->
    <section id="aterrizar" class="oi-seccion-ancha">
      <div class="oi-seccion-cabecera-col">
        <div class="oi-etiqueta-seccion oi-reveal" data-i18n="conectarEtiqueta"></div>
        <h2 class="oi-titulo-seccion oi-reveal" data-i18n="conectarTitulo"></h2>
        <p class="ayuda oi-reveal" data-i18n="conectarBajada"></p>
      </div>

      <p class="oi-aterrizar-frase">
        <span data-i18n="aterrizarFrasePre"></span>
        <span class="oi-select-envoltorio">
          <select id="aterrizar-select-tema" class="oi-select-capsula oi-select-capsula-tema"></select>
        </span>
        <span data-i18n="aterrizarFraseMid"></span>
        <span class="oi-select-envoltorio">
          <select id="aterrizar-select-industria" class="oi-select-capsula oi-select-capsula-industria"></select>
        </span>
      </p>

      <div>
        <p id="aterrizar-conteo" class="oi-aterrizar-conteo"></p>
        <div id="aterrizar-tarjetas" class="oi-grid-resultados"></div>
      </div>
    </section>

    <!-- 03 DESCUBRIR: estudios en el radar -->
    <section id="descubrir" class="oi-seccion-ancha" hidden>
      <div class="oi-seccion-cabecera-col">
        <div class="oi-etiqueta-seccion oi-reveal" data-i18n="anticiparEtiqueta"></div>

        <p class="ayuda oi-reveal" data-i18n="anticiparBajada"></p>
      </div>
      <div id="lista-radar" class="oi-lista-radar"></div>
    </section>

    <!-- BANNER: cita que crece con el scroll -->
    <section id="banner-cita" class="oi-banner-seccion">
      <div id="banner-cita-caja" class="oi-banner-caja">
        <div class="oi-banner-circulo oi-banner-circulo-1" aria-hidden="true"></div>
        <div class="oi-banner-circulo oi-banner-circulo-2" aria-hidden="true"></div>
        <p class="oi-banner-texto" id="banner-cita-texto"></p>
      </div>
    </section>

    <!-- 04 ASÍ AUTOMATICÉ OUTSIDE-IN -->
    <section id="asi-automatice" class="oi-seccion-ancha">
      <div class="oi-seccion-cabecera-col">
        <div class="oi-etiqueta-seccion oi-reveal" data-i18n="asiAutomaticeEtiqueta"></div>
        <h2 class="oi-titulo-seccion oi-reveal" data-i18n="asiAutomaticeTitulo"></h2>
        <div class="oi-firma oi-reveal">
          <img class="oi-foto-perfil oi-foto-firma" src="img/desiree-proceso.jpg" alt="Desiree Solano" width="64" height="64" loading="lazy" />
          <p data-i18n="firmaProceso"></p>
        </div>
      </div>

      <div id="cf-pin-contenedor" class="oi-cf-pin-contenedor">
        <div class="oi-cf-pin">
          <div class="oi-cf-progreso" role="tablist">
            <button type="button" class="oi-cf-progreso-boton" data-etapa="0">01</button>
            <button type="button" class="oi-cf-progreso-boton" data-etapa="1">02</button>
            <button type="button" class="oi-cf-progreso-boton" data-etapa="2">03</button>
          </div>

          <div class="oi-cf-pin-cuerpo">
            <div class="oi-cf-pasos">
              <button type="button" class="oi-cf-paso-boton oi-reveal" data-etapa="0">
                <span class="oi-paso-numero">01</span>
                <span class="oi-paso-titulo" data-i18n="paso1Titulo"></span>
                <span class="oi-paso-desc" data-i18n="paso1Desc"></span>
              </button>
              <button type="button" class="oi-cf-paso-boton oi-reveal" data-etapa="1">
                <span class="oi-paso-numero">02</span>
                <span class="oi-paso-titulo" data-i18n="paso2Titulo"></span>
                <span class="oi-paso-desc" data-i18n="paso2Desc"></span>
              </button>
              <button type="button" class="oi-cf-paso-boton oi-reveal" data-etapa="2">
                <span class="oi-paso-numero">03</span>
                <span class="oi-paso-titulo" data-i18n="paso3Titulo"></span>
                <span class="oi-paso-desc" data-i18n="paso3Desc"></span>
              </button>
            </div>

            <div class="oi-cf-escenario" aria-hidden="true">
              <div class="oi-cf-etapa oi-cf-etapa-rastreo" data-etapa="0">
                <div id="cf-chips-rastreo" class="oi-cf-chips"></div>
              </div>
              <div class="oi-cf-etapa oi-cf-etapa-curaduria" data-etapa="1">
                <div class="oi-cf-filtro"></div>
                <div id="cf-chips-curaduria" class="oi-cf-chips"></div>
              </div>
              <div class="oi-cf-etapa oi-cf-etapa-lectura" data-etapa="2">
                <div class="oi-cf-ficha-ejemplo">
                  <span class="oi-insignia-ejemplo" style="position: static; display: inline-block; margin-bottom: 8px">EJEMPLO</span>
                  <div class="oi-cf-ficha-titulo" data-i18n="cfFichaEjemploTitulo"></div>
                  <div class="oi-cf-ficha-fuente" data-i18n="cfFichaEjemploFuente"></div>
                  <div class="oi-cf-ficha-capsulas">
                    <span class="oi-capsula oi-capsula-tema" id="cf-capsula-tema"></span>
                    <span class="oi-capsula oi-capsula-industria" id="cf-capsula-industria"></span>
                  </div>
                  <div class="oi-cf-ficha-lectura" data-i18n="cfFichaEjemploLectura"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <p class="oi-paso-cierre oi-reveal" data-i18n="asiAutomaticeCierre"></p>
      <div id="contador-numeros-cf" class="oi-contador-numeros oi-reveal"></div>
      <a href="detras-de-outside-in.html" class="oi-ver-todos oi-reveal" data-i18n="asiAutomaticeLeerMas"></a>
    </section>
  </main>

      <div class="oi-footer-top">
        <div class="oi-footer-marca">Outside-In</div>
        <div class="oi-footer-nav">
          <a href="#entender" data-i18n="navEntender"></a>
          <a href="#aterrizar" data-i18n="navConectar"></a>

          <a href="#asi-automatice" data-i18n="navAsiAutomatice"></a>

  <!-- MODAL: ficha(s) de hallazgo -->
