<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Outside-In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;700;800&family=Instrument+Sans:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/estilos.css" />
</head>
<body>
  <div id="franja-vista-previa" class="oi-franja-vista-previa" data-i18n="franjaVistaPrevia" hidden></div>
  <header class="oi-header">
    <div class="oi-header-inner">
      <a href="#inicio" class="oi-logo">
        <span class="oi-logo-circulo"><span class="oi-logo-punto"></span></span>
        Outside-In
      </a>
      <nav id="oi-nav" class="oi-nav">
        <a href="#sobre" data-i18n="navSobre"></a>
        <a href="#hallazgos" data-i18n="navHallazgos"></a>
        <a href="#lo-que-sigo" data-i18n="navLoQueSigo"></a>
        <a href="#matriz" data-i18n="navMatriz"></a>
      </nav>
      <div class="oi-header-acciones">
        <button id="boton-idioma" class="boton-idioma" type="button"></button>
        <button id="boton-menu" class="oi-boton-menu" type="button" aria-expanded="false" aria-controls="oi-nav">
          <span class="oi-menu-linea"></span>
          <span class="oi-menu-linea"></span>
          <span class="oi-menu-linea"></span>
        </button>
      </div>
    </div>
  </header>

  <main>
    <!-- PORTADA -->
    <section id="inicio" class="oi-hero">
      <div class="oi-hero-grid">
        <div class="oi-hero-texto">
          <p class="oi-tagline" data-i18n="heroTagline"></p>
          <h1 class="oi-headline">
            <span data-i18n="heroPalabra1"></span>.<br />
            <span data-i18n="heroPalabra2"></span>.<br />
            <span class="oi-headline-acento" data-i18n="heroPalabra3"></span><span class="oi-headline-punto">.</span>
          </h1>
          <p class="oi-hero-parrafo-capsula">
            <span data-i18n="heroParrafoPre"></span>
            <span class="oi-capsula oi-capsula-tema" id="oi-word-tema"></span>
            <span data-i18n="heroParrafoMid"></span>
            <span class="oi-capsula oi-capsula-industria" id="oi-word-industria"></span><br class="oi-salto-forzado" />
            <span data-i18n="heroParrafoPost"></span>
          </p>
          <a href="#como-funciona" id="senal-vida" class="oi-senal-vida" hidden>
            <span class="oi-punto-vivo" aria-hidden="true"></span>
            <span id="senal-vida-texto"></span>
          </a>
          <div class="oi-bio-fila">
            <div class="oi-foto-placeholder" aria-hidden="true">[Foto]</div>
            <div class="oi-bio-texto">
              <p class="oi-bio-nombre" data-i18n="heroSaludo"></p>
              <p class="oi-bio-cargo" data-i18n="heroCargo"></p>
            </div>
          </div>
          <div class="oi-hero-narrativa">
            <p data-i18n="heroParrafo1"></p>
            <p data-i18n="heroParrafo2"></p>
          </div>
          <div class="oi-hero-ctas">
            <a href="#hallazgos" class="oi-boton oi-boton-primario" data-i18n="heroCtaPrimario"></a>
            <a href="#como-funciona" class="oi-boton oi-boton-secundario" data-i18n="heroCtaSecundario"></a>
          </div>
        </div>
        <div class="oi-hero-diagrama" aria-hidden="true">
          <div class="oi-diagrama-caja">
            <div class="oi-diagrama-circulo-1"></div>
            <div class="oi-diagrama-circulo-2"></div>
            <div class="oi-diagrama-centro" data-i18n="diagramaCentro"></div>
            <span class="oi-particula" style="left: 145px; top: 50px; --dx: 0px; --dy: 95px; animation-delay: 0s"></span>
            <span class="oi-particula" style="left: 237px; top: 70px; --dx: -92px; --dy: 75px; animation-delay: 1s"></span>
            <span class="oi-particula oi-particula-llega" style="left: 237px; top: 145px; --dx: -92px; --dy: 0px; animation-delay: 2s"></span>
            <span class="oi-particula" style="left: 237px; top: 220px; --dx: -92px; --dy: -75px; animation-delay: 3s"></span>
            <span class="oi-particula" style="left: 53px; top: 220px; --dx: 92px; --dy: -75px; animation-delay: 4s"></span>
            <span class="oi-particula oi-particula-llega" style="left: 53px; top: 145px; --dx: 92px; --dy: 0px; animation-delay: 5s"></span>
            <span class="oi-particula" style="left: 53px; top: 70px; --dx: 92px; --dy: 75px; animation-delay: 6s"></span>
            <span class="oi-diagrama-etiqueta oi-etiqueta-arriba oi-pos-1" style="text-align: center" data-i18n="diagramaEstudios"></span>
            <span class="oi-diagrama-etiqueta oi-etiqueta-derecha oi-pos-2" style="text-align: left" data-i18n="diagramaReportes"></span>
            <span class="oi-diagrama-etiqueta oi-etiqueta-derecha oi-pos-3" style="text-align: left" data-i18n="diagramaEncuestas"></span>
            <span class="oi-diagrama-etiqueta oi-etiqueta-derecha oi-pos-4" style="text-align: left" data-i18n="diagramaRankings"></span>
            <span class="oi-diagrama-etiqueta oi-etiqueta-izquierda oi-pos-5" style="text-align: right" data-i18n="diagramaDatos"></span>
            <span class="oi-diagrama-etiqueta oi-etiqueta-izquierda oi-pos-6" style="text-align: right" data-i18n="diagramaInvestigacion"></span>
            <span class="oi-diagrama-etiqueta oi-etiqueta-izquierda oi-pos-7" style="text-align: right" data-i18n="diagramaTendencias"></span>
          </div>
        </div>
      </div>
    </section>

    <!-- 01 SOBRE -->
    <section id="sobre" class="oi-sobre">
      <div class="oi-sobre-inner">
        <div class="oi-etiqueta-seccion oi-etiqueta-clara oi-reveal" data-i18n="sobreEtiqueta"></div>
        <div class="oi-sobre-contenido">
          <blockquote class="oi-sobre-cita oi-reveal" data-i18n="sobreCita"></blockquote>
          <p class="oi-sobre-parrafo oi-reveal" id="sobre-parrafo"></p>
          <button type="button" id="boton-sobre" class="oi-boton oi-boton-claro" data-i18n="sobreBoton"></button>
        </div>
      </div>
    </section>

    <!-- 02 CÓMO FUNCIONA OUTSIDE-IN (siempre visible, no depende de datos) -->
    <section id="como-funciona" class="oi-seccion-ancha">
      <div class="oi-seccion-cabecera-col">
        <div class="oi-etiqueta-seccion oi-reveal" data-i18n="comoFuncionaEtiqueta"></div>
        <h2 class="oi-titulo-seccion oi-reveal" data-i18n="comoFuncionaTitulo"></h2>
      </div>

      <div id="cf-pin-contenedor" class="oi-cf-pin-contenedor">
        <div class="oi-cf-pin">
          <div class="oi-cf-pasos">
            <button type="button" class="oi-cf-paso-boton oi-reveal" data-etapa="0">
              <span class="oi-paso-numero">01</span>
              <span class="oi-paso-titulo" data-i18n="paso1Titulo"></span>
              <span class="oi-paso-desc" data-i18n="paso1Desc"></span>
            </button>
            <button type="button" class="oi-cf-paso-boton oi-reveal" data-etapa="1">
              <span class="oi-paso-numero">02</span>
              <span class="oi-paso-titulo" data-i18n="paso2Titulo"></span>
              <span class="oi-paso-desc" data-i18n="paso2Desc"></span>
            </button>
            <button type="button" class="oi-cf-paso-boton oi-reveal" data-etapa="2">
              <span class="oi-paso-numero">03</span>
              <span class="oi-paso-titulo" data-i18n="paso3Titulo"></span>
              <span class="oi-paso-desc" data-i18n="paso3Desc"></span>
            </button>
          </div>

          <div class="oi-cf-escenario" aria-hidden="true">
            <div class="oi-cf-etapa oi-cf-etapa-rastreo" data-etapa="0">
              <div id="cf-chips-rastreo" class="oi-cf-chips"></div>
            </div>
            <div class="oi-cf-etapa oi-cf-etapa-curaduria" data-etapa="1">
              <div class="oi-cf-filtro"></div>
              <div id="cf-chips-curaduria" class="oi-cf-chips"></div>
            </div>
            <div class="oi-cf-etapa oi-cf-etapa-lectura" data-etapa="2">
              <div class="oi-cf-ficha-ejemplo">
                <span class="oi-insignia-ejemplo" style="position: static; display: inline-block; margin-bottom: 8px">EJEMPLO</span>
                <div class="oi-cf-ficha-titulo" data-i18n="cfFichaEjemploTitulo"></div>
                <div class="oi-cf-ficha-fuente" data-i18n="cfFichaEjemploFuente"></div>
                <div class="oi-cf-ficha-capsulas">
                  <span class="oi-capsula oi-capsula-tema" id="cf-capsula-tema"></span>
                  <span class="oi-capsula oi-capsula-industria" id="cf-capsula-industria"></span>
                </div>
                <div class="oi-cf-ficha-lectura" data-i18n="cfFichaEjemploLectura"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <p class="oi-paso-cierre oi-reveal" data-i18n="comoFuncionaCierre"></p>
      <p class="oi-cf-contador oi-reveal" id="cf-contador"></p>
      <a href="detras-de-outside-in.html" class="oi-ver-todos oi-reveal" data-i18n="comoFuncionaLeerMas"></a>
    </section>

    <!-- 03 HALLAZGOS RECIENTES -->
    <section id="hallazgos" class="oi-seccion-ancha">
      <div class="oi-seccion-cabecera">
        <div>
          <div class="oi-etiqueta-seccion oi-reveal" data-i18n="hallazgosEtiqueta"></div>
          <h2 class="oi-titulo-seccion oi-reveal" data-i18n="hallazgosTitulo"></h2>
        </div>
        <a href="#matriz" class="oi-ver-todos" data-i18n="hallazgosVerTodos"></a>
      </div>
      <div class="oi-carrusel">
        <button type="button" id="hallazgos-flecha-izq" class="oi-carrusel-flecha oi-carrusel-flecha-izq" aria-label="">‹</button>
        <div id="grid-hallazgos" class="oi-grid-hallazgos"></div>
        <button type="button" id="hallazgos-flecha-der" class="oi-carrusel-flecha oi-carrusel-flecha-der" aria-label="">›</button>
      </div>
    </section>

    <!-- 04 LO QUE SIGO DE CERCA (temas + industrias, scroll horizontal) -->
    <section id="lo-que-sigo" class="oi-loquesigo oi-scrollx-section">
      <div class="oi-loquesigo-cabecera">
        <div class="oi-etiqueta-seccion oi-etiqueta-clara oi-reveal" data-i18n="loQueSigoEtiqueta"></div>
        <h2 class="oi-titulo-seccion oi-titulo-claro oi-reveal" data-i18n="loQueSigoTitulo"></h2>
      </div>
      <div class="oi-scrollx-sticky">
        <div id="grid-loquesigo" class="oi-scrollx-track"></div>
      </div>
    </section>

    <!-- BANNER: cita que crece con el scroll -->
    <section id="banner-cita" class="oi-banner-seccion">
      <div id="banner-cita-caja" class="oi-banner-caja">
        <div class="oi-banner-circulo oi-banner-circulo-1" aria-hidden="true"></div>
        <div class="oi-banner-circulo oi-banner-circulo-2" aria-hidden="true"></div>
        <p class="oi-banner-texto" id="banner-cita-texto"></p>
      </div>
    </section>

    <!-- 05 MATRIZ -->
    <section id="matriz" class="oi-seccion-ancha">
      <div class="oi-seccion-cabecera-col">
        <div class="oi-etiqueta-seccion oi-reveal" data-i18n="matrizEtiqueta"></div>
        <h2 class="oi-titulo-seccion oi-reveal" data-i18n="matrizTitulo"></h2>
        <p class="ayuda" data-i18n="matrizAyuda"></p>
      </div>
      <div class="matriz-scroll">
        <table id="tabla-matriz" class="tabla-matriz"></table>
      </div>
    </section>

    <!-- EN MI RADAR: solo se muestra si radar.js trae datos -->
    <section id="en-mi-radar" class="oi-seccion-ancha" hidden>
      <div class="oi-seccion-cabecera-col">
        <h2 class="oi-titulo-seccion oi-reveal" data-i18n="enMiRadarTitulo"></h2>
        <p class="ayuda" data-i18n="enMiRadarAyuda"></p>
      </div>
      <div id="lista-radar" class="oi-lista-radar"></div>
    </section>
  </main>

  <footer class="oi-footer">
    <div class="oi-footer-inner">
      <div class="oi-footer-top">
        <div class="oi-footer-marca">Outside-In</div>
        <div class="oi-footer-nav">
          <a href="#hallazgos" data-i18n="navHallazgos"></a>
          <a href="#lo-que-sigo" data-i18n="navLoQueSigo"></a>
          <a href="#matriz" data-i18n="navMatriz"></a>
          <a id="link-linkedin-footer" href="#" target="_blank" rel="noopener" data-i18n="linkedinFooter"></a>
        </div>
      </div>
      <div class="oi-footer-bottom" data-i18n="subtitulo"></div>
      <div class="oi-footer-firma" data-i18n="footerFirma"></div>
    </div>
  </footer>

  <!-- MODAL: ficha(s) de hallazgo -->
  <dialog id="modal-fichas" class="modal">
    <div class="modal-cabecera">
      <h2 id="modal-titulo"></h2>
      <button id="modal-cerrar" class="modal-cerrar" type="button">&times;</button>
    </div>
    <div id="modal-cuerpo" class="modal-cuerpo"></div>
  </dialog>

  <!-- MODAL: carta de bienvenida completa -->
  <dialog id="modal-sobre" class="modal">
    <div class="modal-cabecera">
      <h2 id="modal-sobre-titulo"></h2>
      <button id="modal-sobre-cerrar" class="modal-cerrar" type="button">&times;</button>
    </div>
    <div id="modal-sobre-cuerpo" class="modal-cuerpo carta"></div>
  </dialog>

  <script src="js/config.js"></script>
  <script src="js/textos.js"></script>
  <script src="js/datos.js"></script>
  <script src="js/radar.js"></script>
  <script src="js/vista-previa.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
