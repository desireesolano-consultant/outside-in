<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Outside-In</title>
  <link rel="stylesheet" href="css/estilos.css" />
</head>
<body>
  <header class="cabecera">
    <div class="cabecera-contenido">
      <div class="cabecera-marca">
        <p class="marca">Outside-In</p>
        <p class="subtitulo" data-i18n="subtitulo"></p>
      </div>
      <button id="boton-idioma" class="boton-idioma" type="button"></button>
    </div>
  </header>

  <main>
    <section id="intro" class="seccion seccion-intro">
      <h1 data-i18n="introTitulo"></h1>
      <div class="carta" id="texto-intro"></div>
    </section>

    <section id="tendencias" class="seccion">
      <h2 data-i18n="tendenciasTitulo"></h2>
      <div id="grid-tendencias" class="grid-tendencias"></div>
    </section>

    <section id="matriz" class="seccion">
      <h2 data-i18n="matrizTitulo"></h2>
      <p class="ayuda" data-i18n="matrizAyuda"></p>
      <div class="matriz-scroll">
        <table id="tabla-matriz" class="tabla-matriz"></table>
      </div>
    </section>

    <section id="sobre-mi" class="seccion seccion-sobre-mi">
      <h2 data-i18n="sobreMiTitulo"></h2>
      <p class="texto-ejemplo" id="texto-sobre-mi"></p>
      <a id="link-linkedin" class="link-linkedin" href="#" target="_blank" rel="noopener" data-i18n="linkedinTexto"></a>
    </section>
  </main>

  <dialog id="modal-fichas" class="modal">
    <div class="modal-cabecera">
      <h2 id="modal-titulo"></h2>
      <button id="modal-cerrar" class="modal-cerrar" type="button">&times;</button>
    </div>
    <div id="modal-cuerpo" class="modal-cuerpo"></div>
  </dialog>

  <footer class="pie">
    <p>&copy; 2026 Desiree Solano</p>
  </footer>

  <script src="js/textos.js"></script>
  <script src="js/datos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
